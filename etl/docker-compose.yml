services:

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger-tracing
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - default
    restart: unless-stopped

  service:
    build: app
    expose:
      - "8000"
    env_file:
      - ./.env
    volumes:
      - static_data:/var/www/static
      - media_data:/var/www/media
    depends_on:
      theatre-db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs:/etc/nginx/conf.d:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      service:
        condition: service_started
      fastapi:
        condition: service_started
      auth-service:
        condition: service_started
    ports:
      - "80:80"
      - "8000:8000"
    restart: unless-stopped

  theatre-db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.6.2
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - elastic
    depends_on:
      elasticsearch:
        condition: service_healthy

  etl:
    build: ./etl
    env_file:
      - ./.env
    volumes:
      - etl_logs:/opt/app/log
      - etl_state:/opt/app/state
    depends_on:
      theatre-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - default
      - elastic
    restart: unless-stopped
  fastapi:
    build: ./fastapi
    image: fastapi-image
    expose:
      - "8002"
    env_file:
      - ./.env
    volumes:
      - fastapi_logs:/opt/app/log
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - default
      - elastic
    restart: always

  auth-redis:
    image: redis:7.2-alpine
    command:
      - redis-server
      - --port
      - "6380"
      - --requirepass
      - ${REDIS_AUTH_PASSW}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "${REDIS_AUTH_PASSW}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
    restart: always

  auth-migrations:
    build: ./auth-service
    command: >
      sh -c "
        python wait-for-postgres.py &&
        echo 'Running Alembic migrations...' &&
        alembic upgrade head &&
        echo 'Migrations completed successfully!'
      "
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: theatre-db
      POSTGRES_PORT: 5432
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-auth_service_db}
      POSTGRES_AUTH_SCHEMA: ${POSTGRES_AUTH_SCHEMA:-auth}
      POSTGRES_CHECK_DB: postgres
    depends_on:
      theatre-db:
        condition: service_healthy
    networks:
      - default
    restart: "no"

  auth-service:
    build: ./auth-service
    expose:
      - "8001"
    env_file:
      - ./.env
    volumes:
      - auth_logs:/opt/app/logs
    depends_on:
      auth-migrations:
        condition: service_completed_successfully
      auth-redis:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --port ${REDIS_PORT}
      --requirepass ${REDIS_PASSW}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSW}", "ping"]
      interval: 6s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: always


volumes:
  postgres_data:
  static_data:
  media_data:
  esdata:
  etl_logs:
  etl_state:
  redis_data:
  fastapi_logs:
  auth_logs:
  auth_redis_data:

networks:
  default:
    driver: bridge
  elastic:
    driver: bridge