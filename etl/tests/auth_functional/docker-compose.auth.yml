services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Стандартные переменные official postgres image
      POSTGRES_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_AUTH_DB:-auth_service_db}

      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}

      POSTGRES_AUTH_APP_USER: ${POSTGRES_AUTH_APP_USER:-auth_admin}
      POSTGRES_AUTH_APP_PASSWORD: ${POSTGRES_AUTH_APP_PASSWORD:-secret}

      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-auth_service_db}
      POSTGRES_AUTH_SCHEMA: ${POSTGRES_AUTH_SCHEMA:-auth}

    volumes:
      - ../../db-init/02-auth-service-db.sql:/docker-entrypoint-initdb.d/01_init_auth_db.sql:ro


    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_AUTH_USER:-auth_admin} -d ${POSTGRES_AUTH_DB:-auth_service_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - auth_test_net

  auth-redis:
    image: redis:7.2-alpine
    command: >
      redis-server
      --port 6379
      --requirepass ${REDIS_AUTH_PASSW:-test-auth-redis-pass}
      --maxmemory 128mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH_PASSW:-test-auth-redis-pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth_test_net

  # ========================================================
  # Миграции Alembic
  # ========================================================
  migrations:
    build:
      context: ../../auth-service
    image: auth-service:test

    # Очищаем entrypoint образа, чтобы не запускался uvicorn/wait-for-postgres.
    entrypoint: []

    command: ["alembic", "upgrade", "head"]

    environment:
      # === OpenTelemetry ===
      OTEL_TRACES_EXPORTER: console
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317

      # === Project ===
      PROJECT_NAME: auth-test

      # === PostgreSQL ===
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-auth_service_db}
      POSTGRES_AUTH_SCHEMA: ${POSTGRES_AUTH_SCHEMA:-auth}

      POSTGRES_AUTH_APP_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      POSTGRES_AUTH_APP_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}

      POSTGRES_ECHO: "false"

      # === Auth Redis ===
      REDIS_AUTH_HOST: auth-redis
      REDIS_AUTH_PORT: 6379
      REDIS_AUTH_PASSW: ${REDIS_AUTH_PASSW:-test-auth-redis-pass}
      REDIS_AUTH_DB: 1
      REDIS_CONNECT_TIMEOUT: 5
      REDIS_SOCKET_TIMEOUT: 5

      # === Rate limit ===
      RATE_LIMIT_ENABLED: "false"

      # === JWT ===
      JWT_SECRET_KEY: test-jwt-secret-key-for-functional-tests
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      # === Permissions cache ===
      PERMS_CACHE_TTL_SECONDS: 60

      # === Password pepper ===
      PASSWORD_PEPPER: test-password-pepper-for-functional-tests

      # === Internal API key ===
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test-internal-api-key}

      # === Yandex OAuth dummy ===
      YANDEX_CLIENT_ID: test-yandex-client-id
      YANDEX_CLIENT_SECRET: test-yandex-client-secret
      YANDEX_REDIRECT_URI: http://127.0.0.1/auth/callback
      YANDEX_AUTH_URL: https://oauth.yandex.ru/authorize
      YANDEX_TOKEN_URL: https://oauth.yandex.ru/token
      YANDEX_INFO_URL: https://login.yandex.ru/info

      # === VK OAuth dummy ===
      VK_CLIENT_ID: test-vk-client-id
      VK_CLIENT_SECRET: test-vk-client-secret
      VK_REDIRECT_URI: http://127.0.0.1/auth/callback

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

    networks:
      - auth_test_net

  # ========================================================
  # Auth-service
  # ========================================================
  auth-service:
    build:
      context: ../../auth-service
    image: auth-service:test

    environment:
      # === OpenTelemetry ===
      OTEL_TRACES_EXPORTER: console
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317

      # === Project ===
      PROJECT_NAME: auth-test

      # === PostgreSQL ===
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-auth_service_db}
      POSTGRES_AUTH_SCHEMA: ${POSTGRES_AUTH_SCHEMA:-auth}

      POSTGRES_AUTH_APP_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      POSTGRES_AUTH_APP_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}

      POSTGRES_ECHO: "false"

      # === Auth Redis ===
      REDIS_AUTH_HOST: auth-redis
      REDIS_AUTH_PORT: 6379
      REDIS_AUTH_PASSW: ${REDIS_AUTH_PASSW:-test-auth-redis-pass}
      REDIS_AUTH_DB: 1
      REDIS_CONNECT_TIMEOUT: 5
      REDIS_SOCKET_TIMEOUT: 5

      # === Rate limit ===
      RATE_LIMIT_ENABLED: "false"

      # === JWT ===
      JWT_SECRET_KEY: test-jwt-secret-key-for-functional-tests
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      # === Permissions cache ===
      PERMS_CACHE_TTL_SECONDS: 60

      # === Password pepper ===
      PASSWORD_PEPPER: test-password-pepper-for-functional-tests

      # === Internal API key ===
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test-internal-api-key}

      # === Yandex OAuth dummy ===
      YANDEX_CLIENT_ID: test-yandex-client-id
      YANDEX_CLIENT_SECRET: test-yandex-client-secret
      YANDEX_REDIRECT_URI: http://127.0.0.1/auth/callback
      YANDEX_AUTH_URL: https://oauth.yandex.ru/authorize
      YANDEX_TOKEN_URL: https://oauth.yandex.ru/token
      YANDEX_INFO_URL: https://login.yandex.ru/info

      # === VK OAuth dummy ===
      VK_CLIENT_ID: test-vk-client-id
      VK_CLIENT_SECRET: test-vk-client-secret
      VK_REDIRECT_URI: http://127.0.0.1/auth/callback

    depends_on:
      postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8001)); s.close()\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - auth_test_net

  # ========================================================
  # Тесты
  # ========================================================
  tests:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      SERVICE_URL: http://auth-service:8001

      TEST_POSTGRES_HOST: postgres
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      TEST_POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}
      TEST_POSTGRES_DB: ${POSTGRES_AUTH_DB:-auth_service_db}
      TEST_AUTH_SCHEMA: ${POSTGRES_AUTH_SCHEMA:-auth}

      TEST_REDIS_HOST: auth-redis
      TEST_REDIS_PORT: 6379
      TEST_REDIS_PASSW: ${REDIS_AUTH_PASSW:-test-auth-redis-pass}
      TEST_REDIS_DB: 1

      PASSWORD_PEPPER: test-password-pepper-for-functional-tests

    depends_on:
      auth-service:
        condition: service_healthy

    networks:
      - auth_test_net

    entrypoint: >
      sh -c "
        echo 'Running auth functional tests...' &&
        pytest src -v
      "

networks:
  auth_test_net:
    driver: bridge